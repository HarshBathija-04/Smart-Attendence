name: keep-alive

# Render free instances sleep after 15 minutes idle; ping both services every 10.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping API (also checks the database)
        env:
          URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::notice::BACKEND_URL is not set, skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "${URL%/}/health"
      - name: Ping face service
        env:
          URL: ${{ vars.AI_SERVICE_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::notice::AI_SERVICE_URL is not set, skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "${URL%/}/health"
